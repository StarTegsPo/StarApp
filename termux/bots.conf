# Список ботов: "имя|путь к .py файлу|порт веб-сервера (если есть, иначе пусто)"
# Имя — только латиница/цифры, по нему называются логи и pid-файлы.
# Каждый бот запускается в папке своего файла, поэтому относительные пути
# к базам данных у ботов из разных папок не пересекаются.
# Чтобы бот не запускался, закомментируйте строку символом #.

BOTS=(
  "startegs|$HOME/startegs_v56.py|"
  "startegsshop|$HOME/startegsshop/main.py|"
  "startegsbuyer|$HOME/startegsbuyer/main.py|"   # ← проверьте путь
  "startegsai|$HOME/startegsai/main.py|"         # ← проверьте путь
)

# Каким Python запускать (можно указать путь к python из venv)
PYTHON=python

# Куда писать логи и служебные файлы
RUN_ROOT="$HOME/.startegs-run"
