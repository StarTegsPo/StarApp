name: Проверка «Прогрев TikTok» на эмуляторе

# Ставит APK на Android-эмулятор вместе с тестовой лентой (faketok) и проверяет:
# работает ли прогрев, когда приложение свёрнуто, и встаёт ли он на паузу, когда свёрнут TikTok.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/tiktok-warmup/android/**'
      - '.github/workflows/tiktok-warmup-emulator.yml'

concurrency:
  group: warmup-emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка (debug) приложения и тестовой ленты
        working-directory: tools/tiktok-warmup/android
        run: gradle :app:assembleDebug :faketok:assembleDebug --no-daemon

      - name: Эмулятор и проверка
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/tiktok-warmup/android/ci/emulator_test.sh

      - name: Скриншоты и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check
          path: tools/tiktok-warmup/android/ci/out/
