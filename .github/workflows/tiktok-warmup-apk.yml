name: Сборка «Прогрев TikTok»

# Собирает APK из tools/tiktok-warmup/android и публикует его в релизе «warmup-latest».
# Постоянная ссылка: https://github.com/StarTegsPo/StarApp/releases/download/warmup-latest/TikTokWarmup.apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/tiktok-warmup/android/**'
      - '.github/workflows/tiktok-warmup-apk.yml'

permissions:
  contents: write

concurrency:
  group: warmup-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка APK
        working-directory: tools/tiktok-warmup/android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Переименовать
        run: |
          cp tools/tiktok-warmup/android/app/build/outputs/apk/release/app-release.apk TikTokWarmup.apk
          ls -lh TikTokWarmup.apk

      - name: version.json для автообновления в приложении
        run: |
          python3 - <<'PY'
          import json, re
          g = open("tools/tiktok-warmup/android/app/build.gradle", encoding="utf-8").read()
          code = int(re.search(r"versionCode\s+(\d+)", g).group(1))
          name = re.search(r"versionName\s+['\"]([^'\"]+)", g).group(1)
          notes = [l.strip() for l in open("tools/tiktok-warmup/android/app/src/main/assets/whatsnew.txt", encoding="utf-8") if l.strip()]
          json.dump({"versionCode": code, "versionName": name, "notes": notes}, open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          print(open("version.json", encoding="utf-8").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokWarmup-apk
          path: TikTokWarmup.apk

      - name: Опубликовать в релизе warmup-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: warmup-latest
          name: Прогрев TikTok (последняя сборка)
          prerelease: true
          make_latest: false
          files: |
            TikTokWarmup.apk
            version.json
          body: |
            Скачайте TikTokWarmup.apk на телефон и установите (разрешите установку из неизвестных источников).
            Сборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.
