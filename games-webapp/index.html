<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0a16" />
  <title>StarGames</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="view" class="view"></main>
  <nav class="nav" id="nav" aria-label="Разделы">
    <span class="nav-pill" id="navPill"></span>
    <button class="nav-btn" data-tab="home" aria-label="Игры">
      <svg viewBox="0 0 24 24"><path d="M6 9h4M8 7v4M15 10h.01M18 8h.01M7.5 4h9A5.5 5.5 0 0 1 22 9.5v3A5.5 5.5 0 0 1 16.5 18c-1.6 0-2.4-1.5-4.5-1.5S9.1 18 7.5 18A5.5 5.5 0 0 1 2 12.5v-3A5.5 5.5 0 0 1 7.5 4Z"/></svg>
      <span>Игры</span>
    </button>
    <button class="nav-btn" data-tab="top" aria-label="Рейтинг">
      <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>Рейтинг</span>
    </button>
    <button class="nav-btn" data-tab="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0"/></svg>
      <span>Профиль</span>
    </button>
  </nav>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <script type="module" src="/app.js"></script>
</body>
</html>
