# Настройки мода StarTegs. После изменения запустите сборку заново (Actions → Сборка клиента StarTegs).

# Название приложения на телефоне и id пакета (ставится рядом с обычным Telegram)
app_name=StarTegs
package=org.startegs.messenger
mod_version=2.0

# Сборка на основе этого коммита официального клиента (github.com/DrKLO/Telegram)
upstream_commit=3de37c8cfb039452be7398909461da6288babf15

# Бот StarTegs: по тарифу в нём (Premium/VIP) открываются функции мода, туда же идёт облачный архив.
# Пусто — все функции бесплатны, облачного архива нет.
eco_bot=StarTegsEcosistem_bot

# Бот для пункта «Спросить ИИ» в меню сообщения (пусто — пункт скрыт)
ai_bot=StarTegsAi_bot

# Архитектуры процессора. arm64-v8a подходит почти всем телефонам последних лет.
# Каждая дополнительная архитектура заметно удлиняет сборку.
abi=arm64-v8a

# Сервисы в разделе «StarTegs» в настройках.
# Формат: название | подпись | username бота без @ | цвет1 | цвет2 | иконка | режим
#   иконка: stars, shop, business, chat, premium, features
#   режим:  chat — открыть чат с ботом (там кнопка мини-приложения)
#           app  — сразу открыть главное мини-приложение бота (нужно включить Main Mini App в @BotFather)
# Пустой username — пункт не показывается.
service.1=StarTegs|Удалённые сообщения, архив, Premium|StarTegsEcosistem_bot|FFB659FF|FF617CFF|stars|chat
service.3=Маркет|Покупка и продажа между пользователями|StarTegsShop_bot|FF1BA4ED|FF1488E1|shop|chat
service.4=ИИ-ассистент|StarTegsAi: чат, картинки, голос|StarTegsAi_bot|FF55CA47|FF27B434|chat|chat
service.5=Бизнес-аналитика|StarApp: каналы, боты, продажи|StarTegsBuisnes_bot|FFF45255|FFDF3955|premium|chat
